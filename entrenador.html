<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Empire Performance — Coaches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=24">
  <link rel="stylesheet" href="css/account.css?v=36">
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="nebula-glow glow-1"></div>
  <div class="nebula-glow glow-2"></div>

  <header class="site-header">
    <a href="index.html" class="logo warp-link">
      <span class="logo-main">VERTICAL EMPIRE</span>
      <span class="logo-sub">PERFORMANCE</span>
    </a>
    <nav class="nav">
      <a href="trabaja-con-nosotros.html" class="nav-account warp-link" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </a>
    </nav>
  </header>
  <div class="header-spacer"></div>

  <main class="account-main">
    <div class="account-card">
      <form class="account-form" id="loginForm">
        <p class="account-title">Acceso de coaches.</p>

        <p class="account-message" id="loginMessage"></p>

        <div class="form-field full">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" name="loginEmail" required>
        </div>

        <div class="form-field full">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" name="loginPassword" required>
        </div>

        <a href="#" class="account-forgot">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="btn-primary account-submit" id="loginSubmit">Iniciar sesión</button>
      </form>

    </div>
  </main>

  <script src="js/stars.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=1"></script>
  <script>window.ACCOUNT_CONFIG = { role: 'coach', redirectTo: 'panel-coach.html' };</script>
  <script src="js/account.js?v=2"></script>
  <script src="js/warp.js?v=1"></script>
</body>
</html>
